lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  apps/console:
    dependencies:
      '@mavibase/config':
        specifier: workspace:*
        version: link:../../packages/config

  apps/server:
    dependencies:
      '@mavibase/config':
        specifier: workspace:*
        version: link:../../packages/config

  apps/worker:
    dependencies:
      '@mavibase/config':
        specifier: workspace:*
        version: link:../../packages/config

  packages/config: {}

  packages/contracts: {}

  packages/core:
    dependencies:
      '@mavibase/contracts':
        specifier: workspace:*
        version: link:../contracts
